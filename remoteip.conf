# Mounted at /etc/apache2/mods-enabled/remoteip.conf (see docker-compose.yaml).
#
# Why this exists: the container sits behind a TLS-terminating reverse proxy.
#
# 1. Audit logs would record the proxy's IP instead of the member's.
#    ChurchCRM reads $_SERVER['REMOTE_ADDR'] in four places
#    (ChurchCRM/Utils/LoggerUtils.php:175,231 and ChurchCRM/Slim/SlimUtils.php:161,275).
#    mod_remoteip rewrites REMOTE_ADDR from X-Forwarded-For, but only for sources
#    listed in RemoteIPTrustedProxy -- without that restriction any client could
#    forge its own IP by sending the header directly.
#
# 2. mod_remoteip ships in mods-available/ but is NOT enabled by the base image,
#    so the LoadModule has to be here. This is why the file is mounted into
#    mods-enabled/ rather than conf-enabled/: it needs to be parsed early.
#
# 3. ServerName: upstream's default.conf sets none, so Apache logs
#    AH00558 on every start. Valid in the main server context.
#
# The app already honours X-Forwarded-Proto itself (ChurchCRM/Bootstrapper.php:470)
# for the Secure session cookie, so TLS termination needs nothing here.
#
# Both variables are interpolated from the environment and defaulted in
# docker-compose.yaml, so they are never empty -- an empty RemoteIPTrustedProxy
# is a fatal config error.

LoadModule remoteip_module /usr/lib/apache2/modules/mod_remoteip.so

RemoteIPHeader X-Forwarded-For
RemoteIPTrustedProxy ${CRM_TRUSTED_PROXY}

ServerName ${CRM_SERVER_NAME}